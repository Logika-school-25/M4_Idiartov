<!DOCTYPE html>
<html lang='uk'>
<head>
    <meta charset='UTF-8'>
    <link rel="stylesheet" href="style.css">
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Calculator</title>
</head>
<body>
    <div class="clock"></div>

    <div class='container start'>
        <h3 class = 'container_h3'></h3>
        <div class='start-btn'>Почати</div>
    </div>
    <div class = 'container main'>
        <div class='question'>2 + 2</div>
        <div class = 'ans-row'>
            <div class='answer'>4</div>
            <div class='answer'>6</div>
            <div class='answer'>10</div>
            <div class='answer'>400</div>
            <div class='answer'>500</div>
        </div>
    </div>
    <br>
    <table class='res'>
        <caption>Усі Ваші результати</caption>
        <tr>
            <td>К-сть питань</td>
            <td>К-сть правильних відповідей</td>
            <td>Точність</td>
        </tr>
    </table>
    
    <script src='https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js'></script> 
    <script src="script.js"></script>
</body>
</html>
